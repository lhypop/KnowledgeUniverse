<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Universe — 文献知识宇宙</title>
<style>
/* ─── Reset & Base ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--fg:#e0d5c1;
--fg2:#a09080;--fg3:#706050;--accent:#e8a840;--accent2:#c07830;
--border:#3a3028;--radius:8px;--shadow:0 2px 12px rgba(0,0,0,.4);
--font:'Segoe UI',system-ui,-apple-system,sans-serif;
--green:#60b878;--red:#d05050;--blue:#6098d8;
--card-bg:#1a1a1a;--card-bg2:#252525;
}
[data-theme="blue"]{
--bg:#0a1628;--bg2:#12223a;--bg3:#1c3050;--fg:#d0dce8;
--fg2:#8098b8;--fg3:#506080;--accent:#5090d0;--accent2:#3068b0;
--border:#203850;--card-bg:#12223a;--card-bg2:#1c3050;
--green:#50a870;--red:#c86060;--blue:#6098e0;
}
[data-theme="forest"]{
--bg:#0f1a10;--bg2:#162818;--bg3:#1e3820;--fg:#c8d8c0;
--fg2:#80a080;--fg3:#506850;--accent:#50b860;--accent2:#309040;
--border:#284828;--card-bg:#162818;--card-bg2:#1e3820;
--green:#40a060;--red:#c05050;--blue:#5098c0;
}
/* The HTML content is the same as root index.html — sidebar renamed, two sub tabs, new JS */
</style>
</head>
<body class="hidden-scrollbar">
<div class="app">
<aside class="sidebar">
<div class="brand"><span class="icon">🌌</span><span>Knowledge Universe</span></div>
<nav class="sidebar-nav">
<button data-tab="papers" class="active">📄 订阅的相关文献</button>
<button data-tab="journal-subs">📰 期刊订阅</button>
<button data-tab="keyword-subs">🔑 关键字订阅</button>
<button data-tab="stats">📊 统计</button>
</nav>
<div class="sidebar-footer"><div class="theme-picker" id="theme-picker">
<button class="t-amber active" data-theme="amber" title="琥珀暗夜"></button>
<button class="t-blue" data-theme="blue" title="深蓝学术"></button>
<button class="t-forest" data-theme="forest" title="墨绿经典"></button>
<button class="t-cyber" data-theme="cyber" title="赛博紫"></button>
<button class="t-light" data-theme="light" title="极简灰白"></button>
</div></div>
</aside>
<main class="main-content" id="main-content">
<div id="view-papers">
<div class="toolbar"><div class="search-box"><span class="search-icon">🔍</span><input type="text" id="paper-search" placeholder="搜索相关文献标题或摘要..." /></div>
<select class="sort-select" id="sort-select" onchange="currentSort=this.value;loadPapers(true)">
<option value="date-desc">📅 最新优先</option><option value="date-asc">📅 最早优先</option><option value="citations-desc">📊 引用最多</option><option value="title-asc">📝 标题 A-Z</option></select>
<label class="select-all-wrap" title="全选"><input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this.checked)" /><span>全选</span></label>
<div class="filter-chips" id="status-chips"><button class="chip active" data-status="">全部</button><button class="chip" data-status="new">未读</button><button class="chip" data-status="read">已读</button><button class="chip" data-status="starred">⭐ 收藏</button></div></div>
<div class="batch-bar hidden" id="batch-bar"><span>已选 <span class="count" id="batch-count">0</span> 篇</span><button onclick="batchAction('star')">⭐ 收藏</button><button onclick="batchAction('read')">✅ 标已读</button><button onclick="batchAction('unread')">🔄 标未读</button><span style="flex:1"></span><button class="danger" onclick="batchAction('delete')">🗑️ 删除</button><button onclick="clearSelection()">✕ 取消</button></div>
<div class="paper-grid" id="paper-grid"></div><div id="load-more-container"></div></div>
<div id="view-journal-subs" class="hidden"><div class="add-sub-form"><h3>➕ 添加期刊订阅</h3><div class="form-row"><input type="text" id="js-name" placeholder="订阅名称" style="flex:1" /><input type="text" id="js-query" placeholder="期刊名称，如：Nature, NeurIPS..." list="journal-list" style="flex:2" /><datalist id="journal-list"></datalist><input type="number" id="js-max" value="30" min="1" max="100" /><button class="btn accent" onclick="addJournalSub()">添加</button></div><div style="font-size:0.85em;color:var(--fg2)">匹配 arXiv 论文的 journal-ref 字段</div></div><div class="sub-grid" id="journal-sub-grid"></div></div>
<div id="view-keyword-subs" class="hidden"><div class="add-sub-form"><h3>➕ 添加关键字订阅</h3><div class="form-row"><input type="text" id="ks-name" placeholder="订阅名称" style="flex:1" /><input type="text" id="ks-keyword" placeholder="关键字，如：large language model..." style="flex:2" /><input type="number" id="ks-max" value="10" min="1" max="50" /><button class="btn accent" onclick="addKeywordSub()">添加</button></div><div style="font-size:0.85em;color:var(--fg2)">检索论文标题与摘要，支持多词短语匹配</div></div><div class="sub-grid" id="keyword-sub-grid"></div></div>
<div id="view-stats" class="hidden"></div>
<div class="modal-overlay hidden" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
</main></div>
<!-- JS same as root index.html with journal-subs / keyword-subs API calls -->
</body></html>
