<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Universe — 文献知识宇宙</title>
<style>
/* ─── Reset & Base ──────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text2: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --yellow: #d2991d;
  --red: #f85149;
  --purple: #bc8cff;
  --radius: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ─── Layout ────────────────────────────────── */
.app { max-width: 1200px; margin: 0 auto; padding: 20px; }
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
.logo { font-size: 1.5em; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.logo .icon { font-size: 1.3em; }
nav { display: flex; gap: 4px; }
nav button {
  background: transparent; border: none; color: var(--text2);
  padding: 8px 16px; cursor: pointer; border-radius: var(--radius);
  font-size: 0.9em; transition: var(--transition);
}
nav button:hover { color: var(--text); background: var(--bg2); }
nav button.active { color: var(--accent); background: var(--bg2); }

/* ─── Papers View ───────────────────────────── */
.toolbar {
  display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
}
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-box input {
  width: 100%; padding: 10px 16px 10px 40px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 0.95em;
  transition: var(--transition);
}
.search-box input:focus { outline: none; border-color: var(--accent); }
.search-box .search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text2); font-size: 1em;
}
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text2); cursor: pointer;
  font-size: 0.85em; transition: var(--transition); white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.paper-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.paper-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; cursor: pointer;
  transition: all var(--transition); position: relative;
}
.paper-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.paper-card .card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.paper-card .title {
  font-size: 1em; font-weight: 600; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.paper-card .star-btn {
  background: none; border: none; color: var(--text2); cursor: pointer;
  font-size: 1.2em; padding: 0 4px; transition: var(--transition); flex-shrink: 0;
}
.paper-card .star-btn.starred { color: var(--yellow); }
.paper-card .meta {
  font-size: 0.8em; color: var(--text2); margin-bottom: 8px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.paper-card .authors { font-size: 0.82em; color: var(--text2); margin-bottom: 8px; }
.paper-card .summary {
  font-size: 0.85em; color: var(--text);
  background: var(--bg3); padding: 10px 12px; border-radius: 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; margin-top: 8px;
}
.paper-card .tags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.paper-card .tag {
  font-size: 0.75em; padding: 2px 8px; background: var(--bg3);
  border-radius: 12px; color: var(--purple);
}
.badge {
  font-size: 0.75em; padding: 2px 8px; border-radius: 12px; font-weight: 600;
}
.badge-new { background: rgba(88,166,255,0.15); color: var(--accent); }
.badge-read { background: rgba(63,185,80,0.15); color: var(--green); }
.badge-arxiv { background: rgba(188,140,255,0.15); color: var(--purple); }
.load-more {
  display: block; width: 100%; padding: 12px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--accent); cursor: pointer; font-size: 0.95em; text-align: center;
  transition: var(--transition);
}
.load-more:hover { background: var(--bg3); }

/* ─── Modal ──────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; width: 100%; max-width: 800px; max-height: 90vh;
  overflow-y: auto; padding: 32px; position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: var(--bg3); border: none; color: var(--text2);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  font-size: 1.2em; transition: var(--transition);
}
.modal-close:hover { color: var(--text); background: var(--border); }
.modal h2 { font-size: 1.2em; margin-bottom: 12px; line-height: 1.4; }
.modal .detail-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.modal .detail-meta span { font-size: 0.85em; color: var(--text2); }
.modal .abstract {
  background: var(--bg3); padding: 16px; border-radius: var(--radius);
  margin-bottom: 16px; font-size: 0.9em; line-height: 1.7;
}
.modal .summary-section {
  background: var(--bg3); padding: 16px; border-radius: var(--radius);
  margin-bottom: 16px; border-left: 3px solid var(--accent);
}
.modal .summary-section h3 { font-size: 0.95em; color: var(--accent); margin-bottom: 8px; }
.modal .actions {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.btn {
  padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); cursor: pointer;
  font-size: 0.9em; transition: var(--transition);
}
.btn:hover { border-color: var(--accent); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.accent:hover { opacity: 0.9; }
.btn.small { padding: 4px 10px; font-size: 0.8em; }
.modal .notes-area {
  width: 100%; min-height: 80px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); padding: 12px;
  font-family: inherit; font-size: 0.9em; resize: vertical; margin-bottom: 12px;
}
.modal .notes-area:focus { outline: none; border-color: var(--accent); }
.modal .relations-section { margin-top: 20px; }
.modal .relations-section h3 { font-size: 0.95em; margin-bottom: 10px; color: var(--text2); }

/* ─── Subscriptions View ────────────────────── */
.sub-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.sub-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.sub-card .sub-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 8px;
}
.sub-card .sub-name { font-weight: 600; font-size: 1em; }
.sub-card .sub-type { font-size: 0.8em; color: var(--purple); }
.sub-card .sub-query {
  font-size: 0.85em; color: var(--text2); margin-bottom: 8px;
  word-break: break-all;
}
.sub-card .sub-meta { font-size: 0.8em; color: var(--text2); }
.sub-card .sub-actions { display: flex; gap: 6px; margin-top: 10px; }
.toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg3); border-radius: 22px; cursor: pointer; transition: var(--transition);
}
.toggle .slider::before {
  content: ''; position: absolute; height: 16px; width: 16px;
  left: 3px; bottom: 3px; background: var(--text2); border-radius: 50%;
  transition: var(--transition);
}
.toggle input:checked + .slider { background: var(--accent); }
.toggle input:checked + .slider::before { transform: translateX(18px); background: #fff; }
.add-sub-form {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
}
.add-sub-form h3 { margin-bottom: 16px; font-size: 1em; }
.form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.form-row input, .form-row select {
  padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 0.9em; flex: 1;
  min-width: 120px;
}
.form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }

/* ─── Stats View ─────────────────────────────── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; text-align: center;
}
.stat-card .stat-value { font-size: 2em; font-weight: 700; color: var(--accent); }
.stat-card .stat-label { font-size: 0.85em; color: var(--text2); margin-top: 4px; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 700px) { .chart-row { grid-template-columns: 1fr; } }
.chart-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.chart-box h3 { font-size: 0.95em; margin-bottom: 12px; color: var(--text2); }
.bar { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
.bar-label { font-size: 0.85em; width: 80px; text-align: right; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s ease; }

/* ─── Toast ──────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 2000;
  padding: 12px 20px; border-radius: var(--radius); font-size: 0.9em;
  color: #fff; animation: slideUp 0.3s ease;
  box-shadow: var(--shadow);
}
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ─── Empty State ────────────────────────────── */
.empty { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty .empty-icon { font-size: 3em; margin-bottom: 16px; }
.empty p { margin-bottom: 6px; }

/* ─── Loading ────────────────────────────────── */
.spinner {
  display: inline-block; width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { text-align: center; padding: 40px; color: var(--text2); }

.hidden { display: none !important; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo">
      <span class="icon">🌌</span>
      <span>Knowledge Universe</span>
    </div>
    <nav>
      <button data-tab="papers" class="active">📄 论文库</button>
      <button data-tab="subscriptions">📡 订阅</button>
      <button data-tab="stats">📊 统计</button>
    </nav>
  </header>

  <div id="view-papers">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="paper-search" placeholder="搜索论文标题或摘要..." />
      </div>
      <div class="filter-chips" id="status-chips">
        <button class="chip active" data-status="">全部</button>
        <button class="chip" data-status="new">未读</button>
        <button class="chip" data-status="read">已读</button>
        <button class="chip" data-status="starred">⭐ 收藏</button>
      </div>
    </div>
    <div class="paper-grid" id="paper-grid"></div>
    <div id="load-more-container"></div>
  </div>

  <div id="view-subscriptions" class="hidden">
    <div class="add-sub-form">
      <h3>➕ 添加订阅</h3>
      <div class="form-row">
        <input type="text" id="sub-name" placeholder="订阅名称（如：LLM前沿）" />
        <select id="sub-type">
          <option value="topic">关键词</option>
          <option value="category">分类</option>
          <option value="author">作者</option>
        </select>
        <select id="sub-source">
          <option value="arxiv">arXiv</option>
        </select>
      </div>
      <div class="form-row">
        <input type="text" id="sub-query" placeholder="查询内容（如：large language model）" style="flex:3" />
        <input type="number" id="sub-max" value="10" min="1" max="50" style="flex:0.5" />
        <button class="btn accent" onclick="addSubscription()">添加</button>
      </div>
    </div>
    <div class="sub-grid" id="sub-grid"></div>
  </div>

  <div id="view-stats" class="hidden"></div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>
</div>

<script>
const API = '';
let currentTab = 'papers';
let paperOffset = 0, paperLimit = 24, paperTotal = 0;
let currentFilter = { status: '', search: '' };

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  return res.json();
}

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
    document.getElementById('view-' + currentTab).classList.remove('hidden');
    if (currentTab === 'papers') loadPapers();
    if (currentTab === 'subscriptions') loadSubscriptions();
    if (currentTab === 'stats') loadStats();
  });
});

async function loadPapers(reset=true) {
  if (reset) { paperOffset = 0; document.getElementById('paper-grid').innerHTML = ''; }
  var status = currentFilter.status, search = currentFilter.search;
  var params = 'limit=' + paperLimit + '&offset=' + paperOffset;
  if (status === 'starred') params += '&starred=1';
  else if (status) params += '&status=' + status;
  if (search) params += '&search=' + encodeURIComponent(search);

  var grid = document.getElementById('paper-grid');
  if (reset) grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  var data = await api('/api/papers?' + params);
  paperTotal = data.total;

  if (reset) grid.innerHTML = '';
  if (!data.papers || data.papers.length === 0) {
    if (reset) grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>没有找到论文</p><p style="font-size:0.85em">试试添加订阅或搜索 arXiv</p></div>';
    document.getElementById('load-more-container').innerHTML = '';
    return;
  }

  data.papers.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'paper-card';
    card.onclick = function(e) { if (!e.target.closest('.star-btn')) showPaperDetail(p.id); };

    var authors = Array.isArray(p.authors) ? p.authors.slice(0, 3).join(', ') : (p.authors || '');
    var tags = Array.isArray(p.tags) ? p.tags : [];
    var starClass = p.is_starred ? 'starred' : '';
    var starIcon = p.is_starred ? '⭐' : '☆';

    card.innerHTML = '<div class="card-header">' +
      '<div class="title">' + esc(p.title || 'Untitled') + '</div>' +
      '<button class="star-btn ' + starClass + '" onclick="event.stopPropagation();toggleStar(' + p.id + ', this)">' + starIcon + '</button></div>' +
      '<div class="meta">' +
      '<span class="badge badge-' + (p.status === 'new' ? 'new' : 'read') + '">' + (p.status === 'new' ? '未读' : '已读') + '</span>' +
      (p.primary_category ? '<span class="badge badge-arxiv">' + esc(p.primary_category) + '</span>' : '') +
      '<span>' + (p.published_date || '') + '</span>' +
      (p.citation_count ? '<span>引用 ' + p.citation_count + '</span>' : '') + '</div>' +
      (authors ? '<div class="authors">' + esc(authors) + (Array.isArray(p.authors) && p.authors.length > 3 ? ' et al.' : '') + '</div>' : '') +
      (p.summary_cn ? '<div class="summary">' + esc(p.summary_cn) + '</div>' : '') +
      (tags.length > 0 ? '<div class="tags">' + tags.map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '');
    grid.appendChild(card);
  });

  var moreDiv = document.getElementById('load-more-container');
  if (data.has_more) {
    moreDiv.innerHTML = '<button class="load-more" onclick="loadMore()">加载更多 (' + (paperOffset + paperLimit) + ' / ' + paperTotal + ')</button>';
  } else {
    moreDiv.innerHTML = paperTotal > paperLimit ? '<p style="text-align:center;color:var(--text2);font-size:0.85em;padding:12px">已加载全部 ' + paperTotal + ' 篇</p>' : '';
  }
}

function loadMore() { paperOffset += paperLimit; loadPapers(false); }

async function toggleStar(id, btn) {
  var data = await api('/api/paper/' + id + '/star', 'POST');
  if (data.is_starred !== undefined) { btn.classList.toggle('starred', data.is_starred); btn.textContent = data.is_starred ? '⭐' : '☆'; }
}

var searchTimer;
document.getElementById('paper-search').addEventListener('input', function() {
  clearTimeout(searchTimer);
  var self = this;
  searchTimer = setTimeout(function() { currentFilter.search = self.value; loadPapers(true); }, 300);
});

document.querySelectorAll('#status-chips .chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    document.querySelectorAll('#status-chips .chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    currentFilter.status = chip.dataset.status;
    loadPapers(true);
  });
});

async function showPaperDetail(id) {
  var overlay = document.getElementById('modal-overlay');
  var content = document.getElementById('modal-content');
  overlay.classList.remove('hidden');
  content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  var paper = await api('/api/paper/' + id);
  if (!paper || paper.error) { content.innerHTML = '<p>加载失败: ' + (paper ? paper.error : '') + '</p>'; return; }

  var authors = Array.isArray(paper.authors) ? paper.authors.join(', ') : (paper.authors || '');
  var categories = Array.isArray(paper.categories) ? paper.categories.join(', ') : (paper.categories || '');
  var tags = Array.isArray(paper.tags) ? paper.tags : [];
  var findings = Array.isArray(paper.key_findings) ? paper.key_findings : [];
  var relations = paper.relations || [];

  content.innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' +
    '<h2>' + esc(paper.title || 'Untitled') + '</h2>' +
    '<div class="detail-meta">' +
    '<span>📅 ' + (paper.published_date || '未知') + '</span>' +
    '<span>📂 ' + esc(paper.primary_category || '') + '</span>' +
    '<span>📑 arXiv: ' + esc(paper.arxiv_id || '') + '</span>' +
    '<span>📊 引用: ' + (paper.citation_count || 0) + '</span>' +
    (paper.rating ? '<span>⭐ ' + paper.rating + '/5</span>' : '') + '</div>' +
    (authors ? '<p style="color:var(--text2);margin-bottom:12px;font-size:0.9em">✍️ ' + esc(authors) + '</p>' : '') +
    '<div class="abstract"><strong>摘要</strong><br>' + esc(paper.abstract || '暂无摘要') + '</div>' +
    (paper.summary_cn ? '<div class="summary-section"><h3>🤖 AI 总结</h3><p>' + esc(paper.summary_cn) + '</p>' + (findings.length > 0 ? '<p style="margin-top:8px;font-size:0.85em;color:var(--green)">关键发现: ' + findings.map(function(f){return esc(f);}).join('；') + '</p>' : '') + '</div>' : '') +
    '<div class="actions">' +
    '<button class="btn ' + (paper.is_starred ? 'accent' : '') + '" onclick="toggleStarInModal(' + paper.id + ', this)">' + (paper.is_starred ? '⭐ 已收藏' : '☆ 收藏') + '</button>' +
    '<button class="btn" onclick="changeStatus(' + paper.id + ', \'' + (paper.status === 'new' ? 'read' : 'new') + '\')">' + (paper.status === 'new' ? '✅ 标记已读' : '🔄 标记未读') + '</button>' +
    '<button class="btn" onclick="generateObsidian(' + paper.id + ')">📝 Obsidian 笔记</button>' +
    (paper.pdf_url ? '<a href="' + esc(paper.pdf_url) + '" target="_blank" class="btn">📄 PDF</a>' : '') +
    (paper.abs_url ? '<a href="' + esc(paper.abs_url) + '" target="_blank" class="btn">🔗 arXiv</a>' : '') + '</div>' +
    '<div style="display:flex;gap:8px;margin-bottom:12px">' +
    '<select id="rate-select" style="padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85em">' +
    '<option value="0">评分</option>' +
    [1,2,3,4,5].map(function(n){ return '<option value="' + n + '" ' + (paper.rating === n ? 'selected' : '') + '>' + '⭐'.repeat(n) + '</option>'; }).join('') + '</select>' +
    '<button class="btn small" onclick="ratePaper(' + paper.id + ')">保存评分</button></div>' +
    '<textarea class="notes-area" id="paper-notes" placeholder="写笔记...">' + esc(paper.notes || '') + '</textarea>' +
    '<button class="btn small" onclick="saveNote(' + paper.id + ')" style="margin-bottom:16px">💾 保存笔记</button>' +
    (tags.length > 0 ? '<div style="margin-bottom:12px"><strong style="font-size:0.9em;color:var(--text2)">标签:</strong>' + tags.map(function(t){ return '<span class="tag" style="cursor:pointer;margin:2px" onclick="removeTag(' + paper.id + ', \'' + esc(t) + '\')">' + esc(t) + ' ✕</span>'; }).join('') + '</div>' : '') +
    '<div style="display:flex;gap:8px;margin-bottom:16px">' +
    '<input type="text" id="new-tag" placeholder="添加标签..." style="flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85em">' +
    '<button class="btn small" onclick="addTag(' + paper.id + ')">+ 添加</button></div>' +
    (relations.length > 0 ? '<div class="relations-section"><h3>🔗 关联论文 (' + relations.length + ')</h3>' + relations.map(function(r){ return '<div style="padding:8px;background:var(--bg3);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:0.85em" onclick="showPaperDetail(' + r.related_paper_id + ')">' + esc(r.related_title || 'Untitled') + '<span style="color:var(--text2);font-size:0.8em"> — ' + r.relation_type + ' (强度: ' + r.strength + ')</span></div>'; }).join('') + '</div>' : '');
}

async function toggleStarInModal(id, btn) {
  var data = await api('/api/paper/' + id + '/star', 'POST');
  if (data.is_starred !== undefined) { btn.textContent = data.is_starred ? '⭐ 已收藏' : '☆ 收藏'; btn.classList.toggle('accent', data.is_starred); toast(data.is_starred ? '已收藏' : '已取消收藏'); }
}

async function changeStatus(id, status) { await api('/api/paper/' + id + '/status', 'POST', { status: status }); toast('状态已更新为: ' + status); closeModal(); loadPapers(true); }
async function generateObsidian(id) { toast('正在生成 Obsidian 笔记...'); var data = await api('/api/paper/' + id + '/obsidian', 'POST'); toast(data.obsidian_path ? '笔记已生成: ' + data.obsidian_path : '生成完成'); }
async function ratePaper(id) { var rating = parseInt(document.getElementById('rate-select').value); if (rating > 0) { await api('/api/paper/' + id + '/rate', 'POST', { rating: rating }); toast('评分: ' + '⭐'.repeat(rating)); } }
async function saveNote(id) { var note = document.getElementById('paper-notes').value; await api('/api/paper/' + id + '/note', 'POST', { note: note }); toast('笔记已保存'); }
async function addTag(id) {
  var input = document.getElementById('new-tag');
  var tag = input.value.trim();
  if (!tag) return;
  var paper = await api('/api/paper/' + id);
  var tags = Array.isArray(paper.tags) ? paper.tags : [];
  if (tags.indexOf(tag) === -1) tags.push(tag);
  await api('/api/paper/' + id + '/tag', 'POST', { tags: tags });
  input.value = ''; toast('标签已添加'); showPaperDetail(id);
}
async function removeTag(id, tag) {
  var paper = await api('/api/paper/' + id);
  var tags = (Array.isArray(paper.tags) ? paper.tags : []).filter(function(t) { return t !== tag; });
  await api('/api/paper/' + id + '/tag', 'POST', { tags: tags });
  toast('标签已移除'); showPaperDetail(id);
}

function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

async function loadSubscriptions() {
  var data = await api('/api/subscriptions');
  var grid = document.getElementById('sub-grid');
  var subs = data.subscriptions || [];
  if (subs.length === 0) { grid.innerHTML = '<div class="empty"><div class="empty-icon">📡</div><p>暂无订阅</p><p style="font-size:0.85em">在上方添加你的第一个订阅</p></div>'; return; }
  grid.innerHTML = subs.map(function(s) {
    return '<div class="sub-card"><div class="sub-header"><div><div class="sub-name">' + esc(s.name) + '</div><span class="sub-type">' + esc(s.type) + '</span></div>' +
      '<label class="toggle"><input type="checkbox" ' + (s.active ? 'checked' : '') + ' onchange="toggleSubscription(' + s.id + ', this.checked)"><span class="slider"></span></label></div>' +
      '<div class="sub-query">🔍 ' + esc(s.query) + '</div>' +
      '<div class="sub-meta">' + (s.source ? '来源: ' + esc(s.source) + ' · ' : '') + '每次 ' + s.max_results + ' 篇 · ' + s.frequency +
      (s.last_scan ? '<br>上次扫描: ' + s.last_scan : '') + (s.last_count ? ' · 发现 ' + s.last_count + ' 篇' : '') + '</div>' +
      '<div class="sub-actions"><button class="btn small" onclick="scanSubscription(' + s.id + ')">🔄 立即扫描</button>' +
      '<button class="btn small" onclick="deleteSubscription(' + s.id + ')" style="color:var(--red);border-color:var(--red)">删除</button></div></div>';
  }).join('');
}

async function addSubscription() {
  var name = document.getElementById('sub-name').value.trim();
  var type = document.getElementById('sub-type').value;
  var source = document.getElementById('sub-source').value;
  var query = document.getElementById('sub-query').value.trim();
  var max = parseInt(document.getElementById('sub-max').value) || 10;
  if (!name || !query) { toast('请填写名称和查询内容', 'error'); return; }
  await api('/api/subscriptions', 'POST', { name: name, type: type, query: query, source: source, max_results: max, frequency: 'daily' });
  toast('订阅已添加');
  document.getElementById('sub-name').value = '';
  document.getElementById('sub-query').value = '';
  loadSubscriptions();
}

async function toggleSubscription(id, active) { await api('/api/subscription/' + id + '/toggle', 'POST'); toast(active ? '已启用' : '已停用'); }
async function deleteSubscription(id) { if (!confirm('确认删除此订阅？')) return; await api('/api/subscription/' + id, 'DELETE'); toast('已删除'); loadSubscriptions(); }
async function scanSubscription(id) { toast('正在扫描...'); await api('/api/scan', 'POST'); toast('扫描完成'); loadSubscriptions(); }

async function loadStats() {
  var data = await api('/api/stats');
  var view = document.getElementById('view-stats');
  var cats = data.categories || [];
  var maxCat = Math.max.apply(null, cats.map(function(c){ return c.count; }).concat([1]));
  var trends = data.monthly_trend || [];
  var maxTrend = Math.max.apply(null, trends.map(function(m){ return m.count; }).concat([1]));
  var topAuthors = data.top_authors || [];
  var maxAuthor = Math.max.apply(null, topAuthors.map(function(a){ return a.count; }).concat([1]));

  view.innerHTML = '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-value">' + (data.total_papers || 0) + '</div><div class="stat-label">总论文</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (data.new_papers || 0) + '</div><div class="stat-label">未读</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (data.starred_papers || 0) + '</div><div class="stat-label">已收藏</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (data.read_papers || 0) + '</div><div class="stat-label">已读</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (data.active_subscriptions || 0) + '</div><div class="stat-label">活跃订阅</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (data.avg_citations || 0) + '</div><div class="stat-label">平均引用</div></div></div>' +
    '<div class="chart-row"><div class="chart-box"><h3>📂 分类分布</h3>' +
    cats.map(function(c){ return '<div class="bar"><div class="bar-label">' + esc(c.name) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(5, (c.count / maxCat * 100)) + '%"></div></div><span style="font-size:0.8em;color:var(--text2)">' + c.count + '</span></div>'; }).join('') +
    (cats.length === 0 ? '<p style="color:var(--text2);font-size:0.85em">暂无数据</p>' : '') + '</div>' +
    '<div class="chart-box"><h3>📊 月度趋势</h3>' +
    trends.slice(0, 10).map(function(m){ return '<div class="bar"><div class="bar-label">' + m.month + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(5, (m.count / maxTrend * 100)) + '%"></div></div><span style="font-size:0.8em;color:var(--text2)">' + m.count + '</span></div>'; }).join('') +
    (trends.length === 0 ? '<p style="color:var(--text2);font-size:0.85em">暂无数据</p>' : '') + '</div></div>' +
    '<div class="chart-box" style="margin-bottom:16px"><h3>✍️ 高产作者</h3>' +
    topAuthors.map(function(a){
      var name = '';
      try { name = JSON.parse(a.name)[0] || a.name; } catch(e) { name = a.name; }
      return '<div class="bar"><div class="bar-label" style="width:120px">' + esc(name) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(5, (a.count / maxAuthor * 100)) + '%"></div></div><span style="font-size:0.8em;color:var(--text2)">' + a.count + ' 篇</span></div>';
    }).join('') + (topAuthors.length === 0 ? '<p style="color:var(--text2);font-size:0.85em">暂无数据</p>' : '') + '</div>';
}

function esc(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadPapers();
</script>
</body>
</html>
