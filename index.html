<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Universe — 文献知识宇宙</title>
<style>
/* ─── Reset & Base ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--fg:#e0d5c1;
  --fg2:#a09080;--fg3:#706050;--accent:#e8a840;--accent2:#c07830;
  --border:#3a3028;--radius:8px;--shadow:0 2px 12px rgba(0,0,0,.4);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','Fira Code',monospace;
  --card-bg:#1a1a1a;--hover-bg:#252525;
  --tag-bg:#2a2a2a;--tag-fg:#c0a060;
}
[data-theme="blue"]{
  --bg:#0a1628;--bg2:#12223a;--bg3:#1c3050;--fg:#d0dce8;
  --fg2:#8098b8;--fg3:#506080;--accent:#5090d0;--accent2:#3068b0;
  --border:#203850;--card-bg:#12223a;--hover-bg:#1c3050;
  --tag-bg:#1c3050;--tag-fg:#6098d0;
}
[data-theme="forest"]{
  --bg:#0f1a10;--bg2:#162818;--bg3:#1e3820;--fg:#c8d8c0;
  --fg2:#80a080;--fg3:#506850;--accent:#50b860;--accent2:#309040;
  --border:#284828;--card-bg:#162818;--hover-bg:#1e3820;
  --tag-bg:#1e3820;--tag-fg:#60c070;
}
[data-theme="cyber"]{
  --bg:#100a20;--bg2:#1a1030;--bg3:#281848;--fg:#d8d0f0;
  --fg2:#a090d0;--fg3:#6858a0;--accent:#a060e0;--accent2:#7840c0;
  --border:#382858;--card-bg:#1a1030;--hover-bg:#281848;
  --tag-bg:#281848;--tag-fg:#a070e0;
}
[data-theme="light"]{
  --bg:#f5f0e8;--bg2:#eee8e0;--bg3:#e0d8d0;--fg:#2a2520;
  --fg2:#605850;--fg3:#908880;--accent:#c07820;--accent2:#a05810;
  --border:#d0c8c0;--card-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);
  --hover-bg:#f0e8e0;--tag-bg:#e8e0d8;--tag-fg:#805820;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ─── Sidebar ─── */
.sidebar{
  width:220px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:24px 16px;gap:28px;
  flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto
}
.sidebar .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.sidebar .brand .icon{font-size:24px}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.sidebar-nav button{
  all:unset;cursor:pointer;padding:10px 14px;border-radius:var(--radius);
  font-size:15px;color:var(--fg2);transition:all .15s
}
.sidebar-nav button:hover{background:var(--bg3);color:var(--fg)}
.sidebar-nav button.active{background:var(--accent);color:#0f0f0f;font-weight:600}
.sidebar-footer{margin-top:auto}
.theme-picker{display:flex;gap:6px;flex-wrap:wrap}
.theme-picker button{
  width:22px;height:22px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:border-color .15s
}
.theme-picker button.active{border-color:var(--accent)}
.t-amber{background:#e8a840}
.t-blue{background:#5090d0}
.t-forest{background:#50b860}
.t-cyber{background:#a060e0}
.t-light{background:#d8d0c0}

/* ─── Main ─── */
.main-content{flex:1;padding:28px 32px;overflow-y:auto;max-height:100vh}

/* ─── Toolbar ─── */
.toolbar{
  display:flex;gap:12px;align-items:center;margin-bottom:24px;
  flex-wrap:wrap
}
.search-box{
  flex:1;min-width:200px;position:relative
}
.search-box input{
  width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg2);color:var(--fg);
  font-size:14px;outline:none;transition:border-color .15s
}
.search-box input:focus{border-color:var(--accent)}
.search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px}
.sort-select{
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg2);color:var(--fg);font-size:14px;cursor:pointer;min-width:120px
}
.btn{
  padding:8px 16px;border:none;border-radius:var(--radius);
  background:var(--accent);color:#0f0f0f;font-size:14px;font-weight:600;
  cursor:pointer;transition:opacity .15s
}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{
  background:transparent;color:var(--fg2);border:1px solid var(--border)
}
.btn-outline:hover{background:var(--bg3);color:var(--fg)}
.btn-danger{background:#c04040}

/* ─── Tabs ─── */
.tab-content{display:none}
.tab-content.active{display:block}

/* ─── Cards ─── */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:16px
}
.paper-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;transition:all .15s;
  position:relative;display:flex;flex-direction:column;gap:10px
}
.paper-card:hover{
  border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)
}
.paper-card .card-header{display:flex;justify-content:space-between;align-items:flex-start}
.paper-card .card-actions{display:flex;gap:4px}
.paper-card .card-actions button{
  all:unset;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px;
  opacity:.6;transition:opacity .15s
}
.paper-card .card-actions button:hover{opacity:1}
.paper-card .title{
  font-size:15px;font-weight:600;line-height:1.4;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden
}
.paper-card .meta{
  font-size:12px;color:var(--fg2);display:flex;gap:12px;flex-wrap:wrap
}
.paper-card .abstract{
  font-size:13px;color:var(--fg3);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden
}
.paper-card .tags-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;padding:2px 8px;border-radius:12px;
  background:var(--tag-bg);color:var(--tag-fg)
}
.paper-card .star-badge{
  position:absolute;top:12px;right:12px;font-size:18px;cursor:pointer;
  opacity:.4;transition:opacity .15s
}
.paper-card .star-badge:hover,.paper-card .star-badge.active{opacity:1}

/* ─── Modal ─── */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.7);z-index:100;justify-content:center;
  align-items:center;padding:20px
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:28px
}
.modal h2{font-size:20px;margin-bottom:16px;line-height:1.4}
.modal .detail-row{margin-bottom:12px;font-size:14px}
.modal .detail-row strong{color:var(--fg2);margin-right:8px}
.modal .detail-abstract{
  margin-top:16px;padding:16px;background:var(--bg3);border-radius:var(--radius);
  font-size:14px;line-height:1.6;color:var(--fg2);white-space:pre-wrap;
  max-height:300px;overflow-y:auto
}
.modal .detail-actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.modal .close-btn{
  float:right;background:none;border:none;color:var(--fg3);font-size:24px;
  cursor:pointer
}
.modal .close-btn:hover{color:var(--fg)}

/* ─── Subs List ─── */
.subs-list{display:flex;flex-direction:column;gap:10px}
.sub-item{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;gap:16px
}
.sub-item .sub-info{flex:1}
.sub-item .sub-name{font-weight:600;font-size:15px}
.sub-item .sub-meta{font-size:12px;color:var(--fg3);margin-top:4px}
.sub-item .sub-controls{display:flex;gap:8px;align-items:center}

/* ─── Stats ─── */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;margin-bottom:28px
}
.stat-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;text-align:center
}
.stat-card .stat-value{font-size:32px;font-weight:700;color:var(--accent)}
.stat-card .stat-label{font-size:13px;color:var(--fg2);margin-top:4px}

/* ─── Empty / Loading ─── */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--fg3)
}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* ─── Batch Toolbar ─── */
.batch-toolbar{
  display:none;align-items:center;gap:8px;margin-bottom:12px;
  padding:8px 14px;background:var(--bg3);border-radius:var(--radius);
  font-size:13px;color:var(--fg2)
}
.batch-toolbar.active{display:flex}
.batch-toolbar .selected-count{font-weight:600;color:var(--accent)}

/* ─── Checkbox on cards ─── */
.paper-card .card-checkbox{
  position:absolute;top:12px;left:12px;z-index:2;
  width:18px;height:18px;cursor:pointer;accent-color:var(--accent)
}
.paper-card.with-checkbox{padding-left:44px}

/* ─── Responsive ─── */
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{
    width:100%;height:auto;position:static;flex-direction:row;
    padding:12px 16px;align-items:center;gap:12px;overflow-x:auto
  }
  .sidebar-nav{flex-direction:row}
  .sidebar-footer{display:none}
  .main-content{padding:16px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <span class="icon">🌌</span>
    <span>Knowledge Universe</span>
  </div>
  <nav class="sidebar-nav">
    <button data-tab="papers" class="active">📄 订阅的相关文献</button>
    <button data-tab="subscriptions">📡 订阅</button>
    <button data-tab="stats">📊 统计</button>
  </nav>
  <div class="sidebar-footer">
    <div class="theme-picker" id="theme-picker">
      <button class="t-amber active" data-theme="amber" title="琥珀暗夜"></button>
      <button class="t-blue" data-theme="blue" title="深蓝学术"></button>
      <button class="t-forest" data-theme="forest" title="墨绿经典"></button>
      <button class="t-cyber" data-theme="cyber" title="赛博紫"></button>
      <button class="t-light" data-theme="light" title="极简灰白"></button>
    </div>
  </div>
</aside>

<!-- Main Content -->
<main class="main-content" id="main-content">
  <!-- Papers View -->
  <div id="view-papers">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="paper-search" placeholder="搜索论文标题或摘要..." />
      </div>
      <select class="sort-select" id="sort-select" onchange="currentSort=this.value;loadPapers(true)">
        <option value="date">📅 按日期</option>
        <option value="citations">📊 按引用</option>
        <option value="title">🔤 按标题</option>
      </select>
      <button class="btn btn-sm" onclick="toggleBatchMode()" id="batch-toggle">☑️ 批量管理</button>
    </div>
    <div class="batch-toolbar" id="batch-toolbar">
      <span>已选: <span class="selected-count" id="selected-count">0</span></span>
      <button class="btn btn-sm" onclick="batchAction('star')">⭐ 收藏</button>
      <button class="btn btn-sm" onclick="batchAction('read')">✅ 已读</button>
      <button class="btn btn-sm" onclick="batchAction('unread')">🔄 未读</button>
      <button class="btn btn-sm btn-danger" onclick="batchAction('delete')">🗑️ 删除</button>
    </div>
    <div class="card-grid" id="paper-grid"></div>
    <div class="empty-state" id="paper-empty">
      <div class="icon">📭</div>
      <p>还没有论文。点击 "📡 订阅" 添加追踪。</p>
    </div>
  </div>

  <!-- Subscriptions View -->
  <div id="view-subscriptions" class="tab-content">
    <div class="toolbar">
      <button class="btn" onclick="openAddSub()">➕ 添加订阅</button>
    </div>
    <div class="subs-list" id="subs-list"></div>
    <div class="empty-state" id="subs-empty">
      <div class="icon">📡</div>
      <p>还没有订阅。点击上方按钮添加。</p>
    </div>
  </div>

  <!-- Stats View -->
  <div id="view-stats" class="tab-content">
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</main>

<!-- Paper Detail Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- Add Subscription Modal -->
<div class="modal-overlay" id="add-sub-overlay">
  <div class="modal" id="add-sub-modal">
    <button class="close-btn" onclick="closeAddSub()">&times;</button>
    <h3>➕ 添加订阅</h3>
    <form id="add-sub-form" onsubmit="submitAddSub(event)">
      <div style="margin-bottom:12px">
        <label style="font-size:14px;color:var(--fg2)">名称</label>
        <input type="text" id="sub-name" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);margin-top:4px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:14px;color:var(--fg2)">类型</label>
        <select id="sub-type" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);margin-top:4px">
          <option value="topic">topic (关键词)</option>
          <option value="author">author (作者)</option>
          <option value="category">category (分类)</option>
          <option value="journal">journal (期刊)</option>
          <option value="arxiv_query">arxiv_query (高级)</option>
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:14px;color:var(--fg2)">查询</label>
        <input type="text" id="sub-query" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);margin-top:4px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:14px;color:var(--fg2)">每次最大结果数</label>
        <input type="number" id="sub-max" value="10" min="1" max="100" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);margin-top:4px">
      </div>
      <button type="submit" class="btn">✅ 添加</button>
    </form>
  </div>
</div>

<script>
/* ─── API ─── */
const API = '/api';
let papers=[];let currentTab='papers';let currentSort='date';
let batchMode=false;let selectedPapers=new Set();

async function fetchJSON(url,opts={}){
  try{
    const r=await fetch(url,opts);
    if(!r.ok)throw new Error(r.status);
    return await r.json();
  }catch(e){
    console.error('API error:',e);
    return null;
  }
}

/* ─── Navigation ─── */
document.querySelectorAll('.sidebar-nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.sidebar-nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab=btn.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.getElementById(`view-${currentTab}`).classList.add('active');
    if(currentTab==='papers')loadPapers();
    if(currentTab==='subscriptions')loadSubs();
    if(currentTab==='stats')loadStats();
  });
});

/* ─── Theme ─── */
(()=>{
  const saved=localStorage.getItem('ku-theme')||'amber';
  document.documentElement.setAttribute('data-theme',saved);
  document.querySelectorAll('.theme-picker button').forEach(b=>{
    b.classList.toggle('active',b.dataset.theme===saved);
    b.addEventListener('click',()=>{
      document.querySelectorAll('.theme-picker button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.documentElement.setAttribute('data-theme',b.dataset.theme);
      localStorage.setItem('ku-theme',b.dataset.theme);
    });
  });
})();

/* ─── Papers ─── */
window.loadPapers=async function(resetSearch){
  if(resetSearch)document.getElementById('paper-search').value='';
  const q=document.getElementById('paper-search').value.trim();
  let url=`${API}/papers?sort=${currentSort}&limit=50`;
  if(q)url+=`&search=${encodeURIComponent(q)}`;
  const data=await fetchJSON(url);
  papers=data?.papers||[];
  renderPapers();
};

function renderPapers(){
  const grid=document.getElementById('paper-grid');
  const empty=document.getElementById('paper-empty');
  if(!papers.length){grid.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  grid.innerHTML=papers.map(p=>`
    <div class="paper-card ${batchMode?'with-checkbox':''}" data-id="${p.id}">
      ${batchMode?`<input type="checkbox" class="card-checkbox" ${selectedPapers.has(p.id)?'checked':''} onchange="toggleSelect(${p.id},this.checked)">`:''}
      <div class="card-header">
        <span class="title" onclick="openDetail(${p.id})" style="cursor:pointer">${escHtml(p.title||'No title')}</span>
        <span class="star-badge ${p.is_starred?'active':''}" onclick="toggleStar(${p.id},${p.is_starred})">${p.is_starred?'⭐':'☆'}</span>
      </div>
      <div class="meta">
        <span>👤 ${escHtml((p.authors||['Unknown'])[0])}</span>
        <span>📅 ${p.published_date||'?'}</span>
        <span>📂 ${escHtml(p.primary_category||'N/A')}</span>
        <span>📊 ${p.citation_count||0} cites</span>
        ${p.rating?`<span>${'⭐'.repeat(p.rating)}</span>`:''}
      </div>
      <div class="abstract">${escHtml((p.abstract||'').slice(0,200))}</div>
      ${(p.tags||[]).length?`<div class="tags-row">${p.tags.map(t=>`<span class="tag">${escHtml(t)}</span>`).join('')}</div>`:''}
    </div>
  `).join('');
}

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

window.toggleSelect=function(id,checked){
  if(checked)selectedPapers.add(id);else selectedPapers.delete(id);
  document.getElementById('selected-count').textContent=selectedPapers.size;
};

window.toggleBatchMode=function(){
  batchMode=!batchMode;
  document.getElementById('batch-toolbar').classList.toggle('active',batchMode);
  document.getElementById('batch-toggle').textContent=batchMode?'☑️ 退出批量':'☑️ 批量管理';
  if(!batchMode)selectedPapers.clear();
  renderPapers();
};

window.batchAction=async function(action){
  if(!selectedPapers.size)return alert('请先选择论文');
  const ids=[...selectedPapers];
  if(action==='delete'&&!confirm(`确定删除 ${ids.length} 篇论文？此操作不可撤销。`))return;
  const map={star:'star',read:'status/read',unread:'status/new',delete:'delete'};
  const endpoint=map[action];
  for(const id of ids){
    if(action==='delete')await fetch(`${API}/paper/${id}`,{method:'DELETE'});
    else await fetch(`${API}/paper/${id}/${endpoint}`,{method:'POST'});
  }
  selectedPapers.clear();
  document.getElementById('selected-count').textContent='0';
  loadPapers();
};

window.toggleStar=async function(id,current){
  await fetch(`${API}/paper/${id}/star`,{method:'POST'});
  loadPapers();
};

window.openDetail=async function(id){
  const data=await fetchJSON(`${API}/paper/${id}`);
  const p=data?.paper;if(!p)return;
  document.getElementById('modal').innerHTML=`
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2>${escHtml(p.title||'')}</h2>
    <div class="detail-row"><strong>👤 作者:</strong> ${escHtml((p.authors||[]).join(', '))}</div>
    <div class="detail-row"><strong>📅 发表:</strong> ${p.published_date||'N/A'} | <strong>更新:</strong> ${p.updated_date||'N/A'}</div>
    <div class="detail-row"><strong>📂 分类:</strong> ${escHtml(p.primary_category||'N/A')} (${(p.categories||[]).join(', ')})</div>
    <div class="detail-row"><strong>📊 引用:</strong> ${p.citation_count||0} | <strong>状态:</strong> ${p.status||'new'} | ${p.is_starred?'⭐ 已收藏':'☆ 未收藏'}</div>
    <div class="detail-row"><strong>🔗</strong> <a href="${escHtml(p.abs_url||'#')}" target="_blank">arXiv</a> | <a href="${escHtml(p.pdf_url||'#')}" target="_blank">PDF</a> | <a href="https://arxiv.org/abs/${escHtml(p.arxiv_id||'')}" target="_blank">abs</a></div>
    ${p.tags?.length?`<div class="detail-row"><strong>🏷️ 标签:</strong> ${p.tags.map(t=>`<span class="tag">${escHtml(t)}</span>`).join(' ')}</div>`:''}
    ${p.summary_cn?`<div class="detail-row"><strong>📝 中文摘要:</strong><br>${escHtml(p.summary_cn)}</div>`:''}
    <div class="detail-abstract"><strong>📄 Abstract:</strong><br>${escHtml(p.abstract||'N/A')}</div>
    ${p.key_findings?.length?`<div class="detail-row" style="margin-top:12px"><strong>🔑 Key Findings:</strong><br>${p.key_findings.map(f=>`• ${escHtml(f)}`).join('<br>')}</div>`:''}
    ${p.notes?`<div class="detail-row" style="margin-top:12px"><strong>📝 Notes:</strong><br>${escHtml(p.notes)}</div>`:''}
    <div class="detail-actions">
      <button class="btn btn-sm" onclick="quickAction(${p.id},'star');closeModal()">⭐ 收藏</button>
      <button class="btn btn-sm" onclick="quickAction(${p.id},'status/read');closeModal()">✅ 已读</button>
      <button class="btn btn-sm" onclick="quickAction(${p.id},'status/archived');closeModal()">📦 归档</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('active');
};

window.quickAction=async function(id,action){
  await fetch(`${API}/paper/${id}/${action}`,{method:'POST'});
  loadPapers();
};

window.closeModal=function(){
  document.getElementById('modal-overlay').classList.remove('active');
};

document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

document.getElementById('paper-search').addEventListener('input',function(){
  loadPapers();
});

/* ─── Subscriptions ─── */
window.loadSubs=async function(){
  const data=await fetchJSON(`${API}/subscriptions`);
  const subs=data?.subscriptions||[];
  document.getElementById('subs-empty').style.display=subs.length?'none':'block';
  document.getElementById('subs-list').innerHTML=subs.map(s=>`
    <div class="sub-item">
      <div class="sub-info">
        <div class="sub-name">${escHtml(s.name)}</div>
        <div class="sub-meta">
          ${s.type} · ${escHtml(s.query)} · max ${s.max_results} ·
          last: ${s.last_scan||'never'} · ${s.last_count||0} new
        </div>
      </div>
      <div class="sub-controls">
        ${s.active?`<button class="btn btn-sm btn-outline" onclick="toggleSub(${s.id},false)">停用</button>`:`<button class="btn btn-sm" onclick="toggleSub(${s.id},true)">启用</button>`}
        <button class="btn btn-sm btn-outline" onclick="scanSub(${s.id})">🔍</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSub(${s.id})">🗑️</button>
      </div>
    </div>
  `).join('');
};

window.scanSub=async function(id){await fetch(`${API}/subscription/${id}/scan`,{method:'POST'});loadSubs();loadPapers();};
window.toggleSub=async function(id,active){await fetch(`${API}/subscription/${id}/toggle`,{method:'POST',body:JSON.stringify({active})});loadSubs();};
window.deleteSub=async function(id){if(confirm('删除此订阅？')){await fetch(`${API}/subscription/${id}`,{method:'DELETE'});loadSubs();}};

window.openAddSub=function(){document.getElementById('add-sub-overlay').classList.add('active')};
window.closeAddSub=function(){document.getElementById('add-sub-overlay').classList.remove('active')};
document.getElementById('add-sub-overlay').addEventListener('click',function(e){if(e.target===this)closeAddSub()});

window.submitAddSub=async function(e){
  e.preventDefault();
  const body=JSON.stringify({
    name:document.getElementById('sub-name').value,
    type:document.getElementById('sub-type').value,
    query:document.getElementById('sub-query').value,
    max_results:parseInt(document.getElementById('sub-max').value)||10
  });
  await fetch(`${API}/subscriptions`,{method:'POST',headers:{'Content-Type':'application/json'},body});
  closeAddSub();loadSubs();
};

/* ─── Stats ─── */
window.loadStats=async function(){
  const data=await fetchJSON(`${API}/stats`);
  const s=data?.stats||{};
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-value">${s.total_papers||0}</div><div class="stat-label">总论文数</div></div>
    <div class="stat-card"><div class="stat-value">${s.new_papers||0}</div><div class="stat-label">新论文</div></div>
    <div class="stat-card"><div class="stat-value">${s.starred_papers||0}</div><div class="stat-label">已收藏</div></div>
    <div class="stat-card"><div class="stat-value">${s.subscriptions||0}</div><div class="stat-label">订阅数</div></div>
    <div class="stat-card"><div class="stat-value">${s.total_citations||0}</div><div class="stat-label">总引用</div></div>
  `;
};

/* ─── Init ─── */
loadPapers();
</script>
</body>
</html>
